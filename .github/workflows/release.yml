name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */12 * * *'
  push:
    branches:
      - master
    paths:
      - 'Lite/**'
      - 'Xtra/**'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prep release
        id: purge_urls
        run: |
          set -euo pipefail
          
          GENERAL_EXCLUDE="exclude_for_all.txt"
          LITE_EXCLUDE="exclude_for_mini_Lite_only.txt"
          INCLUDE_NAMES="${INCLUDE_NAMES:-include_for_Pro_Xtra_only.txt,include_for_all.txt}"
          
          L_DIR="${GITHUB_WORKSPACE}/-data/lists"
          CDN_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}"
          VERSIONS="master latest"
          
          rm -rf release tmp && mkdir -p release tmp
          cp -rf Lite Xtra tmp && cd tmp

          normalize_hosts() {
            sed -E 's/^[[:space:]]+|[[:space:]]+$//g' |
            sed '/^[[:space:]]*$/d' |
            sed '/^[[:space:]]*#/d' |
            sed -E 's/^(\|\|?)+//; s/^\|+//' |
            sed -E 's/(\^|\\\*|\/\*)$//g' |
            sed -E 's/\*//g' |
            tr '[:upper:]' '[:lower:]' |
            sed -E 's~^https?://~~; s~^www\.~~; s:/*$::'
          }

          normalize_adblock() {
            sed -E 's/\r$//' |
            sed -E 's/^[[:space:]]+|[[:space:]]+$//g' |
            sed '/^[[:space:]]*$/d' |
            tr '[:upper:]' '[:lower:]'
          }

          normalize_stream() {
            local infile="$1"
            if grep -q -E '\|\||\^' "$infile" 2>/dev/null; then
              normalize_adblock < "$infile"
            else
              normalize_hosts < "$infile"
            fi
          }

          gather_specific() {
            local filename="$1" out="$2"
            : > "$out"
            find "$L_DIR" -type f \( -name "$filename" -o -name "${filename}.*" \) -print0 2>/dev/null |
              while IFS= read -r -d '' f; do
                normalize_stream "$f" >> "$out"
              done || true
            LC_ALL=C sort -u "$out" -o "$out" || true
          }

          gather_csv() {
            local names_csv="$1" out="$2"
            : > "$out"
            IFS=',' read -ra NAMES <<< "$names_csv"
            for n in "${NAMES[@]}"; do
              n="$(echo "$n" | xargs)"
              [ -z "$n" ] && continue
              find "$L_DIR" -type f \( -name "$n" -o -name "${n}.*" \) -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  normalize_stream "$f" >> "$out"
                done || true
            done
            LC_ALL=C sort -u "$out" -o "$out" || true
          }

          general_excl_tmp="$(mktemp)"
          lite_excl_tmp="$(mktemp)"
          includes_tmp="$(mktemp)"
          : > "$general_excl_tmp"
          : > "$lite_excl_tmp"
          : > "$includes_tmp"
          
          if [ -d "$L_DIR" ]; then
            gather_specific "$GENERAL_EXCLUDE" "$general_excl_tmp"
            gather_specific "$LITE_EXCLUDE" "$lite_excl_tmp"
            gather_csv "$INCLUDE_NAMES" "$includes_tmp"
          fi

          urls=""
          while read -r file; do
            basefile="$(basename "$file")"
            
            # Skip list configuration files from being released directly
            if [ "$basefile" = "$GENERAL_EXCLUDE" ] || [ "$basefile" = "$LITE_EXCLUDE" ] || echo "$INCLUDE_NAMES" | grep -qw "$basefile"; then
              continue
            fi

            clean_file=$(echo "$file" | sed 's:\./::g; s:/:_:g')
            newname="1hosts-$clean_file"
            clean_path=$(echo "$file" | sed 's:\./::g')
            
            orig_norm="$(mktemp)"
            normalize_stream "$file" > "$orig_norm" ||true

            # STRICT SEPARATION: Xtra files ONLY get general excludes. Lite files get both.
            active_excl_tmp="$(mktemp)"
            if echo "$file" | grep -qE '(^|\/)[L|l]ite(\/|$)'; then
              cat "$general_excl_tmp" "$lite_excl_tmp" > "$active_excl_tmp"
            else
              cat "$general_excl_tmp" > "$active_excl_tmp"
            fi
            LC_ALL=C sort -u "$active_excl_tmp" -o "$active_excl_tmp"

            # Apply excludes
            if [ -s "$active_excl_tmp" ]; then
              grep -Fvxf "$active_excl_tmp" "$orig_norm" > "../release/$newname" || true
            else
              cp "$orig_norm" "../release/$newname"
            fi
            rm -f "$orig_norm"

            # Apply includes/merging
            if [ -s "$includes_tmp" ] && [ -f "../release/$newname" ]; then
              merged="$(mktemp)"
              cat "../release/$newname" "$includes_tmp" > "$merged" || true
              
              if grep -q -E '\|\||\^' "../release/$newname" 2>/dev/null || grep -q -E '\|\||\^' "$includes_tmp" 2>/dev/null; then
                awk '{
                  if ($0 ~ /^[[:space:]]*$/) next
                  if ($0 ~ /^[[:space:]]*#/) { if (!seen["#"$0]++) print $0; next }
                  if ($0 ~ /^[[:space:]]*!/) { if (!seen["!"$0]++) print $0; next }
                  if (!seen[$0]++) print $0
                }' "$merged" > "../release/$newname" || true
              else
                awk '!/^[[:space:]]*($|#)/ { if (!seen[$0]++) print $0 }' "$merged" > "../release/$newname" || true
              fi
              rm -f "$merged"
            fi

            # Double check excludes against generated output using active exclusions
            if [ -s "$active_excl_tmp" ] && [ -f "../release/$newname" ]; then
              norm_excl="$(mktemp)"
              norm_rel="$(mktemp)"
              out_tmp="$(mktemp)"
              
              sed -E 's/^[[:space:]]+|[[:space:]]+$//g' "$active_excl_tmp" |
                sed '/^[[:space:]]*$/d' |
                sed -E 's/^[!#]//g' |
                sed -E 's/^(\|\|?)+//; s/^\|+//' |
                sed -E 's/(\^|\\\*|\/\*)$//g' |
                sed -E 's~^https?://~~; s~^www\.~~; s:/*$::' |
                tr '[:upper:]' '[:lower:]' |
                sed -E 's/\*//g' > "$norm_excl" || true

              awk '{
                line=$0
                gsub(/^[[:space:]]+|[[:space:]]+$/,"",line)
                if (line=="" || line ~ /^[[:space:]]*#/ ) { print "::COMMENT::"$0; next }
                l=line
                sub(/^[!#]/,"",l)
                gsub(/^\|\|?/,"",l)
                gsub(/\^$|\\\*$|\/\*$/,"",l)
                gsub(/^https?:\/\//,"",l)
                gsub(/^www\./,"",l)
                gsub(/\*+/,"",l)
                print l "::::ORIG::::" $0
              }' "../release/$newname" > "$norm_rel" || true

              awk -F"::::ORIG::::" 'NR==FNR{ex[$1]=1; next} {
                split($0,parts,"::::ORIG::::"); norm=parts[1]; orig=parts[2];
                if (substr(norm,1,9)=="::COMMENT") { print substr($0,index($0,"::::ORIG::::")+11); next }
                if (!(norm in ex)) print orig
              }' "$norm_excl" "$norm_rel" > "$out_tmp" || true

              mv "$out_tmp" "../release/$newname" || true
              rm -f "$norm_excl" "$norm_rel"
            fi
            
            rm -f "$active_excl_tmp"

            if ! grep -q '[^[:space:]#\!]' "../release/$newname"; then
              rm -f "../release/$newname"
              continue
            fi

            for v in $VERSIONS; do
              urls+="${CDN_BASE}@${v}/${clean_path},"
            done
          done < <(find . -type f -print)

          cd .. && rm -rf tmp
          echo "urls=${urls%,*}" >> $GITHUB_OUTPUT
        shell: bash
        env:
          INCLUDE_NAMES: "include_for_Pro_Xtra_only.txt,include_for_all.txt"

      - name: Upload Artifacts for Deploy
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: release/
          retention-days: 1

      - name: Purge jsDelivr Cache
        if: steps.purge_urls.outputs.urls != ''
        uses: egad13/purge-jsdelivr-cache@v1.1.0
        with:
          url: ${{ steps.purge_urls.outputs.urls }}

      - name: Publish Release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Lists"
          files: release/*

      - name: Delete Older Releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        with:
          keep_latest: 1
          delete_tag_pattern: "v"
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
