name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: deploy-filters
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
      GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
      CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
      CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Download assets from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          echo "Fetching assets from the 'latest' release..."
          # This uses the GitHub CLI (installed on runners) to download release assets
          gh release download latest --repo ${{ github.repository }} --pattern "1hosts-*" --dir dist || true

      - name: Verify built artifact exists
        run: |
          echo "Current directory structure:"
          ls -R
          
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            echo "Assets successfully downloaded from Release."
          else
            echo "Error: No files found in dist/. The Release assets might not be ready yet."
            exit 1
          fi

      - name: Prepare output folder
        run: |
          rm -rf out
          mkdir -p out
          cp -r dist/* out/

      - name: Publish to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd out
          git init
          git checkout -b gh-pages
          git remote add target https://x-access-token:${GH_TARGET_PAT}@github.com/${GH_TARGET_REPO}.git
          git add --all
          git commit -m "Publish filter list: ${DEPLOY_SHA}" || echo "No changes to commit"
          git push --force target gh-pages

      - name: Publish to Codeberg
        run: |
          cd out
          git init
          git checkout -b main
          git remote add codeberg https://x-access-token:${CODEBERG_PAT}@codeberg.org/${CODEBERG_REPO}
          git add --all
          git commit -m "Publish filter list: ${DEPLOY_SHA}" || echo "No changes to commit"
          git push --force codeberg HEAD:main

      - name: Create tag on target repo
        run: |
          TAG_NAME="filters-${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${GH_TARGET_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GH_TARGET_REPO}/git/refs \
            -d "$(jq -n --arg ref "refs/tags/$TAG_NAME" --arg sha "${DEPLOY_SHA}" '{ref:$ref, sha:$sha}')"

      - name: Success marker
        run: echo "Deploy finished"
