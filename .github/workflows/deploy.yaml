name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: deploy-filters
  cancel-in-progress: true

jobs:
  deploy:
    # Only run if manual OR the release workflow was successful
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
      GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
      CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
      CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
      # Use the SHA from the release run if available
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # This ensures it grabs the artifact from the Release run that just finished
          run-id: ${{ github.event.workflow_run.id }}
          name: release-dist
          path: dist
        # Continue if manual trigger (where run-id is empty)
        continue-on-error: true

      - name: Verify built artifact exists
        run: |
          echo "Current directory structure:"
          ls -R
          
          # Check dist, then check build, then check if files landed in root
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            echo "Artifacts found in dist/."
          elif [ -d build ] && [ "$(ls -A build)" ]; then
            echo "Artifacts found in build/. Moving to dist/."
            mkdir -p dist && cp -r build/* dist/
          elif ls 1hosts-* 1> /dev/null 2>&1; then
            echo "Artifacts found in root. Moving to dist/."
            mkdir -p dist && mv 1hosts-* dist/
          else
            echo "Error: No built artifacts found (checked dist/, build/, and root)."
            exit 1
          fi

      - name: Prepare output folder
        run: |
          rm -rf out
          mkdir -p out
          cp -r dist/* out/

      - name: Publish to GitHub Pages
        env:
          GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
          GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd out
          git init
          git checkout -b gh-pages
          git remote add target https://x-access-token:${GH_TARGET_PAT}@github.com/${GH_TARGET_REPO}.git
          git add --all
          git commit -m "Publish filter list: ${DEPLOY_SHA}" || echo "No changes to commit"
          git push --force target gh-pages

      - name: Publish to Codeberg
        env:
          CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
        run: |
          cd out
          git init
          git checkout -b main
          git remote add codeberg https://x-access-token:${CODEBERG_PAT}@codeberg.org/${CODEBERG_REPO}
          git add --all
          git commit -m "Publish filter list: ${DEPLOY_SHA}" || echo "No changes to commit"
          git push --force codeberg HEAD:main

      - name: Create tag on target repo
        env:
          GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
          GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
        run: |
          # Use run ID for a unique tag name
          TAG_NAME="filters-${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${GH_TARGET_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GH_TARGET_REPO}/git/refs \
            -d "$(jq -n --arg ref "refs/tags/$TAG_NAME" --arg sha "${DEPLOY_SHA}" '{ref:$ref, sha:$sha}')"

      - name: Success marker
        run: echo "Deploy finished"
