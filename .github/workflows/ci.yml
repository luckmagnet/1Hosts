name: ci

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */12 * * *'

permissions:
  contents: write
  actions: write

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prep submit_here
        run: |
          (
          prints() { sed -e '$a\' "$@"; }
          baseDir="./-data/lists"
          
          # Explicitly process each file safely without cross-talk
          declare -A file_map=(
            ["exclude_for_all.txt"]="$baseDir/exclude_for_all.txt"
            ["exclude_for_mini_Lite_only.txt"]="$baseDir/exclude_for_mini_Lite_only.txt"
            ["include_for_Pro_Xtra_only.txt"]="$baseDir/include_for_Pro_Xtra_only.txt"
            ["include_for_all.txt"]="$baseDir/include_for_all.txt"
          )

          for filename in "${!file_map[@]}"; do
            baseFile="${file_map[$filename]}"
            tempFile="./submit_here/$filename"
            
            # Ensure directories exist
            mkdir -p "$(dirname "$baseFile")"
            mkdir -p "$(dirname "$tempFile")"
            
            if [[ ! -f "$baseFile" ]]; then
              touch "$baseFile"
            fi

            if [[ -f "$tempFile" && -s "$tempFile" ]]; then
              # Append safely and clean up duplicates within the specific file only
              newBase=$(prints "$tempFile" "$baseFile" | awk '!seen[$0]++')
              prints <<<"$newBase" > "$baseFile"
              rm -f "$tempFile" && touch "$tempFile"
            elif [[ ! -f "$tempFile" ]]; then
              touch "$tempFile"
            fi
          done
          )
        shell: bash

      - name: Commit & Push
        uses: actions-js/push@master
        with:
          branch: master
          message: "merge! submit_here"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initiate update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.MY_PAT }}
          repository: ${{ secrets.target_repo }}
          event-type: update
          client-payload: '{"success": true}'

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
